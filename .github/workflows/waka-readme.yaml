name: Waka Readme

on:
  # for manual workflow trigger
  workflow_dispatch:
  schedule:
    # runs at 12 AM UTC (5:30 AM IST)
    - cron: "0 5 * * *"
jobs:
  update-readme:
    name: WakaReadme DevMetrics
    runs-on: ubuntu-latest
    steps:
      - name: Download WakaReadme
        uses: actions/checkout@v4
        with:
          repository: athul/waka-readme
          ref: 370590ad8da8f54282ed92aa42b7c25ecbd5a9a6
          path: .waka-readme
          persist-credentials: false
      - name: Use OAuth Bearer authentication
        shell: python
        run: |
          from pathlib import Path

          path = Path(".waka-readme/main.py")
          source = path.read_text()
          old = 'f"Basic {encoded_key}"'
          new = 'f"Bearer {wk_i.waka_key}"'
          if source.count(old) != 1:
              raise SystemExit("WakaReadme authentication code changed; review the OAuth patch.")
          path.write_text(source.replace(old, new))
      - uses: ./.waka-readme
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          SHOW_TITLE: true # optional
          SECTION_NAME: waka # optional
          BLOCKS: ░▒▓█ # optional
          TIME_RANGE: last_7_days # optional
          LANG_COUNT: 5 # optional
          SHOW_TIME: true # optional
          SHOW_TOTAL: true # optional

